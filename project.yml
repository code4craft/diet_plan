name: DietPlan
options:
  bundleIdPrefix: com.yihua
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: R6G73RUMCT
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DietPlan:
    type: application
    platform: iOS
    sources: [DietPlan]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: DietPlan/Resources/DietPlan.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: DietPlan/Resources/Info.plist
      properties:
        CFBundleDisplayName: 橄榄
        # 只声明中文：日期、系统按钮等始终显示中文，不随手机语言变成英文
        CFBundleLocalizations: [zh-Hans]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: 读取体重、去脂体重、睡眠、步数和活动消耗，用于健康账户和积分计算。
        NSHealthUpdateUsageDescription: 本应用不会写入健康数据。
        NSCameraUsageDescription: 拍照记录饮食和健身。
        NSPhotoLibraryUsageDescription: 从相册选择照片记录饮食和健身。
        NSMicrophoneUsageDescription: 按住说话，用语音记录饮食和健身。
        DulyArkApiKey: $(ARK_API_KEY)
        DulyAsrToken: $(ASR_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yihua.dietplan
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DietPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DietPlanTests]
    dependencies:
      - target: DietPlan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DietPlan:
    build:
      targets:
        DietPlan: all
    test:
      targets: [DietPlanTests]
